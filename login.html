<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduExam Pro | Login</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduExam Pro">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        html, body { width: 100%; overflow-x: hidden; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; min-height: 100svh; }
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-indigo-950 min-h-screen text-slate-900">
    <main class="min-h-screen flex flex-col items-center justify-center p-6">
        <div class="bg-white p-6 sm:p-10 rounded-[2rem] sm:rounded-[2.5rem] shadow-2xl w-full max-w-md mx-4 text-center fade-in">
            <img src="logo.png" alt="EduExam" class="h-20 mx-auto mb-6 object-contain">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
            <p class="text-slate-500 mb-8 font-medium">Log in to your portal</p>

            <button id="install-app-btn" type="button" class="w-full mb-6 bg-slate-900 hover:bg-slate-800 text-white font-black py-3 rounded-2xl shadow-xl shadow-slate-900/10 transition-all active:scale-[0.98]">
                download app
            </button>

            <div class="space-y-5 text-left">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 ml-1">User ID</label>
                    <input type="text" id="login-id" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:ring-0 outline-none transition" placeholder="e.g. admin" autocomplete="username">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 ml-1">Password</label>
                    <input type="password" id="login-pass" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:ring-0 outline-none transition" placeholder="••••••••" autocomplete="current-password">
                </div>
                <button id="login-btn" type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-indigo-200 transition-all active:scale-[0.98]">
                    Sign In
                </button>
            </div>

            <div id="login-error" class="text-red-500 text-sm mt-4 hidden font-semibold">❌ Invalid credentials. Please try again.</div>
        </div>

        <div class="mt-8 flex flex-col items-center gap-2 opacity-60">
            <img src="raazim logo.png" alt="Raazim Tech" class="h-6">
            <p class="text-[10px] font-black tracking-widest text-indigo-300 uppercase">Made by Raazim Tech</p>
        </div>
    </main>

    <script>
        // --- SECURE CLOUD CONFIGURATION ---
        const CLOUD = {
            BIN_ID: "69ef9795856a6821897ba9f0",
            API_KEY: "$2a$10$VgVAfIMuJJkppxqYEA90A.vGGGWZRRwayaU6aApoiIBkH8n2BSF/q",
            URL: "https://api.jsonbin.io/v3/b/69ef9795856a6821897ba9f0"
        };

        let db = { users: [], exams: [], submissions: [] };
        const SESSION_KEY = 'eduexam_session';

        async function fetchState() {
            const res = await fetch(CLOUD.URL, { headers: { "X-Access-Key": CLOUD.API_KEY } });
            const data = await res.json();
            db = data.record || { users: [], exams: [], submissions: [] };
        }

        function persistSession(user) {
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                id: user.id,
                role: user.role,
                class: user.class || null,
                pfp: user.pfp || null
            }));
        }

        function setLoginBusy(isBusy) {
            const btn = document.getElementById('login-btn');
            const idInput = document.getElementById('login-id');
            const passInput = document.getElementById('login-pass');
            if (btn) btn.disabled = isBusy;
            if (idInput) idInput.disabled = isBusy;
            if (passInput) passInput.disabled = isBusy;
            if (btn) btn.innerText = isBusy ? 'Signing In...' : 'Sign In';
        }

        async function login() {
            const error = document.getElementById('login-error');
            if (error) error.classList.add('hidden');

            const id = (document.getElementById('login-id')?.value || '').trim();
            const pass = (document.getElementById('login-pass')?.value || '').trim();
            if (!id || !pass) return;

            setLoginBusy(true);
            try {
                await fetchState();

                let user = null;
                if (id === 'admin' && pass === 'admin123' && (db.users || []).length === 0) {
                    user = { id: 'admin', role: 'admin', class: null };
                } else {
                    user = (db.users || []).find(u => u.id === id && u.pass === pass) || null;
                }

                if (!user) {
                    if (error) error.classList.remove('hidden');
                    return;
                }

                persistSession(user);
                window.location.replace('./index.html');
            } catch (err) {
                console.error('Login failed', err);
                alert('Login failed. Check your internet connection and try again.');
            } finally {
                setLoginBusy(false);
            }
        }

        (() => {
            const loginBtn = document.getElementById('login-btn');
            const idInput = document.getElementById('login-id');
            const passInput = document.getElementById('login-pass');

            if (loginBtn) loginBtn.addEventListener('click', login);
            if (idInput) idInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
            if (passInput) passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

            // If already logged in in this tab, go straight to the app.
            try {
                const session = sessionStorage.getItem(SESSION_KEY);
                if (session) window.location.replace('./index.html');
            } catch (_) {
                // ignore
            }

            // Service worker registration helps make the app installable.
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            }

            const installBtn = document.getElementById('install-app-btn');
            if (!installBtn) return;

            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            if (isStandalone) {
                installBtn.classList.add('hidden');
                return;
            }

            let deferredPrompt = null;

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
            });

            window.addEventListener('appinstalled', () => {
                deferredPrompt = null;
                installBtn.classList.add('hidden');
            });

            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    try {
                        const choice = await deferredPrompt.userChoice;
                        if (choice && choice.outcome === 'accepted') installBtn.classList.add('hidden');
                    } catch (_) {
                        // ignore
                    } finally {
                        deferredPrompt = null;
                    }
                    return;
                }

               
            });
        })();
    </script>
</body>
</html>
