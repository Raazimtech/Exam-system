<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#0b1220;--muted:#64748b;--line:#e5eaf1;--blue:#2563eb;--blue2:#1d4ed8;--soft:#eff6ff;--danger:#be123c;--shadow:0 18px 50px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{min-height:100vh}.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#fff}.auth-hero{background:#0b1220;color:#fff;padding:clamp(28px,6vw,80px);display:flex;flex-direction:column;justify-content:space-between}.auth-hero h1{font-size:clamp(44px,6vw,78px);line-height:.98;letter-spacing:-.055em;margin:60px 0 22px}.auth-hero p{max-width:540px;color:#aeb8c8;font-size:18px;line-height:1.7}.auth-main{display:grid;place-items:center;padding:28px}.auth-box{width:min(440px,100%)}.logo{height:48px;max-width:190px;object-fit:contain}.auth-box h2{font-size:38px;letter-spacing:-.04em;margin:38px 0 8px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}.sub{color:var(--muted);line-height:1.6}.field{width:100%;border:1px solid #d9e0e9;background:#fff;border-radius:13px;padding:13px 14px;outline:0}.field:focus{border-color:#7aa7ff;box-shadow:0 0 0 4px rgba(37,99,235,.1)}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}.btn-soft{background:var(--soft);color:var(--blue)}.btn-muted{background:#eef2f7;color:#475569}.btn-danger{background:#fff1f2;color:var(--danger)}.form{display:grid;gap:13px}.error{background:#fff1f2;color:#be123c;border-radius:12px;padding:12px;font-size:13px;font-weight:700}.app{display:flex;min-height:100vh}.side{width:250px;background:#fff;border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{padding:6px 8px 28px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#64748b;text-align:left;padding:12px 13px;border-radius:11px;font-weight:800}.nav button.active,.nav button:hover{background:var(--soft);color:var(--blue)}.account{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0}.avatar{width:40px;height:40px;border-radius:12px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:900}.main{flex:1;min-width:0}.top{height:78px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,48px);position:sticky;top:0;z-index:20}.content{max-width:1400px;margin:auto;padding:28px clamp(18px,4vw,48px) 60px}.top h1{font-size:24px;margin:0;letter-spacing:-.03em}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:20px}.stat .n{font-size:32px;font-weight:900;letter-spacing:-.05em;margin-top:8px}.stat .l{font-size:11px;color:#94a3b8;font-weight:900;text-transform:uppercase;letter-spacing:.12em}.section{padding:22px}.section h2{font-size:20px;margin:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px;border-bottom:1px solid #edf1f5;font-size:13px}.table th{color:#94a3b8;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase}.badge.blue{background:#eff6ff;color:#1d4ed8}.badge.green{background:#ecfdf5;color:#047857}.badge.gray{background:#f1f5f9;color:#64748b}.exam-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.exam{padding:20px}.exam h3{margin:12px 0 6px;font-size:18px}.exam p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.question{padding:22px}.option{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:13px;margin-top:10px;align-items:flex-start}.option:hover{border-color:#9bbcff;background:#f8fbff}.timer{font-variant-numeric:tabular-nums;font-weight:900;color:#b45309}.modal{position:fixed;inset:0;background:rgba(2,6,23,.58);backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;z-index:100}.modal-box{background:#fff;border-radius:20px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:24px}.toast{position:fixed;right:18px;bottom:18px;background:#0b1220;color:#fff;padding:13px 16px;border-radius:12px;z-index:200;font-weight:800}.install{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0b1220;color:#fff;border-radius:16px;padding:15px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px;z-index:90;width:min(520px,calc(100% - 28px))}.install strong{display:block}.install small{color:#aeb8c8}@media(max-width:900px){.auth{grid-template-columns:1fr}.auth-hero{display:none}.side{width:76px;padding:14px}.side .brand img{width:45px;object-fit:contain}.side .nav button{font-size:0;text-align:center}.side .nav button::first-letter{font-size:18px}.account .name,.account .role{display:none}.stats{grid-template-columns:repeat(2,1fr)}.exam-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.side{display:none}.stats,.exam-grid{grid-template-columns:1fr}.top{height:68px}.content{padding-top:20px}.table-wrap{overflow:auto}.auth-box h2{font-size:32px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPABASE_URL='https://dpiwdhtbhwjgatvcfkcb.supabase.co',SUPABASE_KEY='sb_publishable_PSZnTEo74jObih_6TTpXVQ_tJwzTnXY',ADMIN_FN=SUPABASE_URL+'/functions/v1/edux-admin-v2';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,profile=null,assessments=[],submissions=[],view='home',activeExam=null,timer=null,remaining=0,deferredInstall=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const email=id=>id.toLowerCase()+'@users.edux.app';
function toast(x){const d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function fmt(n){return String(Math.max(0,n)).padStart(2,'0')}
function installBanner(){if(window.matchMedia('(display-mode: standalone)').matches||localStorage.eduxInstallDismissed)return;const b=document.createElement('div');b.className='install';b.innerHTML='<div style="flex:1"><strong>Use EduX as an app</strong><small>Install EduX for a faster, focused exam experience.</small></div><button class="btn btn-primary" id="installBtn">Install</button><button class="btn btn-muted" id="dismissInstall">×</button>';document.body.appendChild(b);$('#dismissInstall').onclick=()=>{localStorage.eduxInstallDismissed='1';b.remove()};$('#installBtn').onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;b.remove()}else{toast('On your browser menu, choose “Add to Home screen” or “Install app”.')}}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;setTimeout(installBanner,700)});window.addEventListener('appinstalled',()=>{document.querySelector('.install')?.remove()});
async function load(){const p=await sb.from('edux_profiles').select('*').eq('id',user.id).single();if(p.error||!p.data)throw Error('Your EduX account has not been provisioned by the administrator.');profile=p.data;const[a,s]=await Promise.all([sb.from('edux_assessments').select('*').order('created_at',{ascending:false}),sb.from('edux_submissions').select('*').order('submitted_at',{ascending:false})]);assessments=a.data||[];submissions=s.data||[]}
function auth(){document.body.innerHTML=`<section class="auth"><div class="auth-hero"><div><img class="logo" src="logo official.png" alt="EduX"><div style="height:4px;width:46px;background:#2563eb;border-radius:99px;margin-top:55px"></div><h1>Focus on the<br>exam. Not the<br>software.</h1><p>EduX is the assessment workspace for students and teachers. Your administrator creates your account and controls your access.</p></div><small style="color:#718096">EduX • Academic Assessment Platform</small></div><div class="auth-main"><div class="auth-box"><img class="logo" src="logo official.png" alt="EduX"><div style="margin-top:45px"><div class="eyebrow">Student & Teacher Portal</div><h2>Welcome back.</h2><p class="sub">Sign in with the User ID and password provided by your administrator.</p><form class="form" id="login" style="margin-top:25px"><input class="field" id="uid" placeholder="User ID" autocomplete="username" required><input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn btn-primary">Sign in to EduX</button><div id="err" class="error hidden"></div></form><p class="sub" style="font-size:12px;text-align:center;margin-top:22px">Need an account? Contact your administrator.</p></div></div></section>`;$('#login').onsubmit=async e=>{e.preventDefault();const id=$('#uid').value.trim(),pass=$('#pw').value;if(!/^[A-Za-z0-9][A-Za-z0-9_.-]{1,31}$/.test(id)){showErr('Invalid User ID.');return}const r=await sb.auth.signInWithPassword({email:email(id),password:pass});if(r.error){showErr('Incorrect User ID or password.');return}user=r.data.user;try{await load();app();}catch(x){await sb.auth.signOut();showErr(x.message)}}}
function showErr(x){const e=$('#err');e.textContent=x;e.classList.remove('hidden')}
function app(){document.body.innerHTML='<div id="app"></div>';draw();installBanner()}
function draw(){if(activeExam){examView();return}const isTeacher=profile.role==='teacher';document.querySelector('#app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><img class="logo" src="logo official.png" alt="EduX"></div><nav class="nav"><button class="${view==='home'?'active':''}" data-v="home">⌂ <span>Dashboard</span></button><button class="${view==='exams'?'active':''}" data-v="exams">▣ <span>${isTeacher?'My Exams':'Exams'}</span></button><button class="${view==='results'?'active':''}" data-v="results">◔ <span>${isTeacher?'Submissions':'Results'}</span></button></nav><div class="account"><div class="avatar">${esc(profile.user_id[0].toUpperCase())}</div><div class="name" style="font-weight:900;margin-top:8px">${esc(profile.user_id)}</div><div class="role" style="font-size:10px;color:#94a3b8;text-transform:uppercase;font-weight:900;letter-spacing:.1em">${esc(profile.role)}</div></div></aside><main class="main"><header class="top"><div><div class="eyebrow">${esc(profile.class_name||'EduX Workspace')}</div><h1>${view==='home'?'Dashboard':view==='exams'?(isTeacher?'My Assessments':'Available Exams'):'Results & Feedback'}</h1></div><button class="btn btn-danger" id="logout">Sign out</button></header><div class="content" id="content"></div></main></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;draw()});$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};homeView();if(view==='exams')examsView();if(view==='results')resultsView()}
function homeView(){if(view!=='home')return;const mine=submissions.filter(s=>s.student_id===user.id),available=profile.role==='student'?assessments.filter(a=>a.class_name===profile.class_name):assessments.filter(a=>a.author_id===user.id),avg=mine.length?Math.round(mine.reduce((n,s)=>n+(s.total_questions?s.score/s.total_questions*100:0),0)/mine.length):0;$('#content').innerHTML=`<div class="grid stats">${stat(profile.role==='student'?'Available exams':'Published exams',available.length)}${stat(profile.role==='student'?'Completed':'Submissions',mine.length)}${stat('Average score',avg+'%')}${stat('Account',profile.role==='student'?(profile.class_name||'Student'):'Teacher')}</div><div class="grid" style="grid-template-columns:1.4fr .6fr;margin-top:18px"><section class="card section"><div class="section-head"><div><h2>${profile.role==='student'?'Your next exams':'Your recent exams'}</h2><p class="sub" style="font-size:13px">${profile.role==='student'?'Assessments assigned to your class.':'Assessments you have created.'}</p></div><button class="btn btn-soft" onclick="view='exams';draw()">View all</button></div>${available.slice(0,3).map(examCard).join('')||empty('Nothing here yet',profile.role==='student'?'Your administrator or teacher has not assigned an exam to your class.':'Create your first assessment from the Exams section.')}</section><section class="card section"><h2>Recent results</h2>${mine.slice(0,5).map(resultRow).join('')||empty('No results yet','Completed assessments will appear here.')}</section></div>`}
function stat(label,n){return`<div class="card stat"><div class="l">${label}</div><div class="n">${esc(n)}</div></div>`}function empty(a,b){return`<div class="empty"><b style="color:#0b1220;display:block;margin-bottom:7px">${a}</b>${b}</div>`}
function examCard(a){return`<article class="card exam" style="margin-bottom:12px"><span class="badge blue">${a.duration_minutes} min</span><h3>${esc(a.title)}</h3><p>${esc(a.class_name)} • ${Array.isArray(a.questions)?a.questions.length:0} questions</p><div style="margin-top:16px"><button class="btn btn-primary" onclick="startExam('${a.id}')">${profile.role==='student'?'Start exam':'Open assessment'}</button></div></article>`}
function examsView(){if(view!=='exams')return;const list=profile.role==='student'?assessments.filter(a=>a.class_name===profile.class_name):assessments.filter(a=>a.author_id===user.id);$('#content').innerHTML=`<section class="card section"><div class="section-head"><div><h2>${profile.role==='teacher'?'My Assessments':'Available Exams'}</h2><p class="sub" style="font-size:13px">${profile.role==='teacher'?'Create, edit and review the assessments you own.':'Only exams assigned to your class are shown here.'}</p></div>${profile.role==='teacher'?'<button class="btn btn-primary" id="newExam">+ New assessment</button>':''}</div><div class="grid exam-grid">${list.map(examCard).join('')||empty('No assessments found','There are no assessments available right now.')}</div></section>`;if($('#newExam'))$('#newExam').onclick=()=>editor()}
function editor(existing=null){const a=existing||{title:'',duration_minutes:30,class_name:'',questions:[{text:'',options:['','','',''],answer:0}]};const q=a.questions||[];const html=`<div class="modal"><div class="modal-box"><div class="section-head"><div><div class="eyebrow">Teacher workspace</div><h2 style="margin:5px 0 0">${existing?'Edit assessment':'Create assessment'}</h2></div><button class="btn btn-muted" id="closeM">Close</button></div><form id="examForm" class="form"><input class="field" id="et" value="${esc(a.title)}" placeholder="Assessment title" required><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><input class="field" id="ed" type="number" min="1" max="300" value="${a.duration_minutes}" placeholder="Minutes" required><select class="field" id="ec"><option value="">Select class</option><option>Sophomore Software Eng</option><option>Junior Software Eng</option><option>Senior Software Eng</option></select></div><div id="questions">${q.map((x,i)=>questionEditor(x,i)).join('')}</div><button type="button" class="btn btn-soft" id="addQ">+ Add question</button><button class="btn btn-primary">${existing?'Save changes':'Publish assessment'}</button></form></div></div>`;document.body.insertAdjacentHTML('beforeend',html);$('#ec').value=a.class_name||'';$('#closeM').onclick=()=>document.querySelector('.modal')?.remove();$('#addQ').onclick=()=>{const i=document.querySelectorAll('[data-q]').length;$('#questions').insertAdjacentHTML('beforeend',questionEditor({text:'',options:['','','',''],answer:0},i))};$('#examForm').onsubmit=async e=>{e.preventDefault();const qs=[...document.querySelectorAll('[data-q]')].map((el,i)=>({text:el.querySelector('.qt').value,options:[...el.querySelectorAll('.qo')].map(x=>x.value),answer:Number(el.querySelector('.qa').value)}));if(!qs.length||qs.some(x=>!x.text||x.options.some(o=>!o))){toast('Complete every question and option.');return}const payload={title:$('#et').value.trim(),duration_minutes:Number($('#ed').value),class_name:$('#ec').value,author_id:user.id,questions:qs,updated_at:new Date().toISOString()};let r=existing?await sb.from('edux_assessments').update(payload).eq('id',existing.id):await sb.from('edux_assessments').insert(payload);if(r.error){toast(r.error.message);return}document.querySelector('.modal')?.remove();await load();draw();toast(existing?'Assessment updated.':'Assessment published.')}}
function questionEditor(x,i){return`<div class="question card" data-q style="margin-top:12px"><div class="section-head"><b>Question ${i+1}</b><button type="button" class="btn btn-danger" onclick="this.closest('[data-q]').remove()">Remove</button></div><input class="field qt" value="${esc(x.text)}" placeholder="Question text" required>${x.options.map((o,j)=>`<div style="display:flex;gap:8px;margin-top:8px"><input class="field qo" value="${esc(o)}" placeholder="Option ${j+1}" required><label style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:900;color:#64748b"><input type="radio" name="correct-${i}" ${Number(x.answer)===j?'checked':''} onchange="this.closest('[data-q]').querySelector('.qa').value='${j}'"> Correct</label></div>`).join('')}<input type="hidden" class="qa" value="${Number(x.answer)||0}"></div>`}
function startExam(id){const a=assessments.find(x=>x.id===id);if(!a)return;if(profile.role==='teacher'){editor(a);return}if(submissions.some(s=>s.assessment_id===id&&s.student_id===user.id)){toast('You have already submitted this assessment.');return}activeExam={...a,answers:{}};remaining=Number(a.duration_minutes)*60;examView();timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);submitExam(true)}},1000)}
function examView(){const a=activeExam;document.body.innerHTML=`<div class="shell"><header class="top"><div><div class="eyebrow">EduX Assessment</div><h1>${esc(a.title)}</h1></div><div class="timer" id="timer">${fmt(Math.floor(remaining/60))}:${fmt(remaining%60)}</div></header><main class="content"><div class="card section"><div class="section-head"><div><b>${esc(a.class_name)}</b><div class="sub">${a.questions.length} questions • ${a.duration_minutes} minutes</div></div><button class="btn btn-danger" id="submitTop">Submit exam</button></div></div><form id="answerForm" style="margin-top:16px">${a.questions.map((q,i)=>`<section class="card question"><div class="eyebrow">Question ${i+1} of ${a.questions.length}</div><h2 style="margin:8px 0 14px;font-size:19px">${esc(q.text)}</h2>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}</section>`).join('')}<button class="btn btn-primary" style="width:100%;margin-top:16px">Submit assessment</button></form></main></div>`;$('#answerForm').onsubmit=e=>{e.preventDefault();submitExam(false)};$('#submitTop').onclick=()=>submitExam(false)}
function updateTimer(){const t=$('#timer');if(t)t.textContent=fmt(Math.floor(remaining/60))+':'+fmt(remaining%60)}
async function submitExam(auto){if(!activeExam)return;clearInterval(timer);const answers={};activeExam.questions.forEach((q,i)=>{const v=document.querySelector(`input[name="q${i}"]:checked`);answers[i]=v?Number(v.value):null});const score=activeExam.questions.reduce((n,q,i)=>n+(answers[i]===Number(q.answer)?1:0),0);const r=await sb.from('edux_submissions').insert({assessment_id:activeExam.id,student_id:user.id,answers,score,total_questions:activeExam.questions.length,time_taken_seconds:Number(activeExam.duration_minutes)*60-remaining});if(r.error){toast(r.error.message);return}activeExam=null;await load();view='results';app();toast(auto?'Time expired. Your answers were submitted.':'Assessment submitted successfully.')}
function resultRow(s){const a=assessments.find(x=>x.id===s.assessment_id),p=s.total_questions?Math.round(s.score/s.total_questions*100):0;return`<div style="padding:13px 0;border-bottom:1px solid #edf1f5;display:flex;justify-content:space-between;gap:10px"><div><b>${esc(a?.title||'Assessment')}</b><div class="sub" style="font-size:11px">${new Date(s.submitted_at).toLocaleDateString()}</div></div><span class="badge ${p>=70?'green':'gray'}">${p}%</span></div>`}
function resultsView(){if(view!=='results')return;const list=profile.role==='teacher'?submissions.filter(s=>assessments.some(a=>a.id===s.assessment_id&&a.author_id===user.id)):submissions.filter(s=>s.student_id===user.id);$('#content').innerHTML=`<section class="card section"><div class="section-head"><div><h2>${profile.role==='teacher'?'Student submissions':'Your results'}</h2><p class="sub" style="font-size:13px">${profile.role==='teacher'?'Review performance from your assessments.':'Review your scores and teacher feedback.'}</p></div></div>${list.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Assessment</th><th>${profile.role==='teacher'?'Student':'Score'}</th><th>${profile.role==='teacher'?'Score':'Submitted'}</th><th>Feedback</th></tr></thead><tbody>${list.map(s=>{const a=assessments.find(x=>x.id===s.assessment_id),p=s.total_questions?Math.round(s.score/s.total_questions*100):0,u=profile.role==='teacher'?null:null;return`<tr><td><b>${esc(a?.title||'Assessment')}</b><div style="font-size:11px;color:#94a3b8">${new Date(s.submitted_at).toLocaleString()}</div></td><td>${profile.role==='teacher'?esc(s.student_id.slice(0,8)+'…'):p+'%'}</td><td><span class="badge ${p>=70?'green':'gray'}">${p}%</span></td><td>${esc(s.feedback||'—')}</td></tr>`}).join('')}</tbody></table></div>`:empty('No submissions yet','Results will appear here after assessments are completed.')}</section>`}
(async()=>{const r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;try{await load();app()}catch{await sb.auth.signOut();auth()}}else auth()})();
</script>
</body></html>
