<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amoud Assessment | Download</title>
    <link rel="icon" type="image/png" href="logo1.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#16a34a" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .clay-btn {
        background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
        box-shadow: 0 18px 40px rgba(22, 163, 74, 0.35), 0 8px 18px rgba(22, 163, 74, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -10px 18px rgba(3, 7, 18, 0.22);
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="max-w-3xl mx-auto px-6 py-12">
      <header class="bg-white border border-slate-200 rounded-3xl p-8 shadow-sm">
        <div class="flex items-center gap-4">
          <img src="logo1.png" alt="Amoud Assessment" class="h-14 w-14 object-contain" />
          <div>
            <h1 class="text-3xl font-black tracking-tight">Amoud Assessment</h1>
            <p class="text-slate-500 font-semibold">Download page</p>
          </div>
        </div>

        <div class="mt-8">
          <button
            id="install-app-btn"
            type="button"
            class="inline-flex justify-center items-center px-6 py-5 rounded-2xl clay-btn text-white font-black tracking-wide text-xl hover:brightness-[1.02] transition"
          >
            Download app
          </button>
        </div>

        <p id="install-hint" class="mt-4 text-xs text-slate-500">
          If you do not get an install prompt, use your browser menu: “Install app” / “Add to Home
          Screen”.
        </p>
      </header>
    </main>

    <script>
      (() => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        }

        const installBtn = document.getElementById("install-app-btn");
        const hint = document.getElementById("install-hint");
        if (!installBtn) return;

        let deferredPrompt = null;

        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          deferredPrompt = e;
        });

        window.addEventListener("appinstalled", () => {
          deferredPrompt = null;
          installBtn.textContent = "Installed";
          installBtn.disabled = true;
          if (hint) hint.textContent = "Installed. Open it from your home screen / desktop icon.";
        });

        installBtn.addEventListener("click", async () => {
          if (!deferredPrompt) {
            if (hint) {
              hint.textContent =
                "No install prompt yet. Make sure you are on HTTPS (or localhost), then use your browser menu: “Install app” / “Add to Home Screen”.";
            }
            return;
          }

          installBtn.disabled = true;
          const original = installBtn.textContent;
          installBtn.textContent = "Installing…";

          deferredPrompt.prompt();
          try {
            const choice = await deferredPrompt.userChoice;
            if (choice?.outcome !== "accepted") {
              installBtn.disabled = false;
              installBtn.textContent = original;
              if (hint) hint.textContent = "Install was cancelled. You can try again.";
            }
          } catch (_) {
            installBtn.disabled = false;
            installBtn.textContent = original;
          }
        });
      })();
    </script>
  </body>
</html>
